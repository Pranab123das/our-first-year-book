
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#fce7f0">

    <meta name="description"
          content="A little book written with love, celebrating our first year together.">

    <title>Our First Year ♡</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Main JavaScript -->
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- MAIN BOOK EXPERIENCE -->
    <main id="bookExperience">

        <!-- BOOK PRESENTATION -->
        <section class="book-stage" id="bookStage">

            <!-- BOOK SHADOW -->
            <div class="book-shadow"></div>

            <!-- HARDCOVER -->
            <div class="book" id="anniversaryBook">

                <!-- BOOK SPINE -->
                <div class="book-spine"></div>

                <!-- FRONT COVER -->
                <div class="book-cover" id="bookCover">

                    <!-- COVER TEXTURE -->
                    <div class="cover-texture"></div>

                    <!-- OUTER GOLD BORDER -->
                    <div class="cover-border outer-border"></div>

                    <!-- INNER GOLD BORDER -->
                    <div class="cover-border inner-border"></div>

                    <!-- TOP ORNAMENT -->
                    <div class="cover-top-ornament">
                        ❧
                    </div>

                    <!-- EMBOSSED HEART -->
                    <div class="cover-heart">
                        ♡
                    </div>

                    <!-- BOOK TITLE -->
                    <div class="cover-title-area">

                        <p class="cover-pretitle">
                            A LITTLE BOOK OF
                        </p>

                        <h1
                            class="cover-title"
                            id="coverTitle"
                            data-text="Our First Year"
                            aria-label="Our First Year">
                        </h1>

                        <div class="title-divider">
                            <span></span>
                            ♡
                            <span></span>
                        </div>

                        <!-- ANNIVERSARY DATE -->
                        <p
                            class="cover-date"
                            id="coverDate"
                            data-text="07 • 02 • 2027"
                            aria-label="7 February 2027">
                        </p>

                    </div>

                    <!-- BOTTOM ORNAMENT -->
                    <div class="cover-bottom-ornament">
                        ❧
                    </div>

                    <!-- COVER CORNER DETAILS -->
                    <span class="corner-decoration top-left">❧</span>
                    <span class="corner-decoration top-right">❧</span>
                    <span class="corner-decoration bottom-left">❧</span>
                    <span class="corner-decoration bottom-right">❧</span>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
